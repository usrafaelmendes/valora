[package]
name = "compara-precos-desktop"
version = "0.1.0"
description = "Shell desktop (Tauri) do Valora"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Nome distinto do binário para evitar conflito de artefatos no Windows.
name = "compara_precos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
# Gerador aleatório do sistema operacional, para as senhas do banco local e o segredo do JWT.
getrandom = "0.3"

# Código específico de cada sistema operacional (ver src/plataforma.rs): encerrar o backend junto
# com o app e mostrar mensagem de erro nativa. Todas já estão na árvore de dependências do Tauri.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# Mensagem de erro nativa (o GTK já é usado pelo Tauri no Linux).
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
